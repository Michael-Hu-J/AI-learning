# .gitlab-ci.yml
stages:
  - test

variables:
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_PASSWORD: seckill123
  REDIS_HOST: redis
  REDIS_PORT: "6379"

api-test:
  stage: test
  image: python:3.11
  services:
    - mysql:8.0
    - redis:7-alpine
  script:
    - pip install -r requirements.txt
    - pip install pytest requests
    - sleep 10  # 等 MySQL 启动
    - python migrate.py
    - pytest tests/api/ -v --junitxml=reports/api-report.xml
  artifacts:
    reports:
      junit: reports/api-report.xml

ui-test:
  stage: test
  image: mcr.microsoft.com/playwright/python:v1.44.0
  services:
    - mysql:8.0
    - redis:7-alpine
  script:
    - pip install -r requirements.txt
    - playwright install --with-deps
    - sleep 10
    - python migrate.py
    - pytest tests/ui/ -v --junitxml=reports/ui-report.xml
  artifacts:
    reports:
      junit: reports/ui-report.xml
