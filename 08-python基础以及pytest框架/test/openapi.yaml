openapi: 3.0.0
info:
  title: 电商秒杀与财务一体化系统 API
  description: '完整的电商秒杀与财务一体化系统后端API文档


    功能模块：

    - 用户认证与授权

    - 商品管理

    - 采购管理（采购订单、采购入库）

    - 销售管理（销售订单、销售出库）

    - 秒杀功能（高并发秒杀、防超卖）

    - 财务管理（自动记账、凭证、报表）

    - 库存管理（库存流水、库存调整）


    认证方式：JWT Bearer Token

    '
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com
servers:
- url: http://localhost:5000
  description: 本地开发环境
- url: https://api.example.com
  description: 生产环境
tags:
- name: 认证
  description: 用户认证相关接口
- name: 商品管理
  description: 商品CRUD和库存查询
- name: 采购管理
  description: 采购订单和采购入库管理
- name: 销售管理
  description: 销售订单和销售出库管理
- name: 秒杀功能
  description: 秒杀活动和秒杀订单
- name: 财务管理
  description: 财务凭证和财务报表
- name: 库存管理
  description: 库存流水和库存调整
paths:
  /api/auth/register:
    post:
      tags:
      - 认证
      summary: 用户注册
      description: 新用户注册，注册成功后返回JWT Token
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: testuser
              password: password123
              email: test@example.com
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      tags:
      - 认证
      summary: 用户登录
      description: 用户登录，登录成功后返回JWT Token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: testuser
              password: password123
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      tags:
      - 认证
      summary: 用户注销
      description: 用户注销（客户端清除Token即可）
      operationId: logout
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 注销成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 注销成功
  /api/auth/profile:
    get:
      tags:
      - 认证
      summary: 获取用户信息
      description: 获取当前登录用户的详细信息
      operationId: getProfile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/products:
    get:
      tags:
      - 商品管理
      summary: 商品列表
      description: 获取商品列表（允许未登录查看）
      operationId: getProducts
      parameters:
      - name: status
        in: query
        description: 商品状态筛选
        schema:
          type: string
          enum:
          - active
          - inactive
      - name: category
        in: query
        description: 商品分类筛选
        schema:
          type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags:
      - 商品管理
      summary: 创建商品
      description: 创建新商品（管理员权限）
      operationId: createProduct
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未授权
        '403':
          description: 权限不足（需要管理员权限）
  /api/purchase/orders:
    get:
      tags:
      - 采购管理
      summary: 采购订单列表
      description: 获取采购订单列表（管理员权限）
      operationId: getPurchaseOrders
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        description: 订单状态筛选
        schema:
          type: string
          enum:
          - pending
          - confirmed
          - received
          - cancelled
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseOrder'
    post:
      tags:
      - 采购管理
      summary: 创建采购订单
      description: 创建新的采购订单（管理员权限）
      operationId: createPurchaseOrder
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseOrderRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          description: 请求参数错误
  /api/purchase/receives:
    post:
      tags:
      - 采购管理
      summary: 采购入库
      description: 根据采购订单创建采购入库单（管理员权限）
      operationId: createPurchaseReceive
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - purchase_order_id
              properties:
                purchase_order_id:
                  type: integer
                  description: 采购订单ID
                  example: 1
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockIn'
        '400':
          description: 请求参数错误
  /api/sales/orders:
    get:
      tags:
      - 销售管理
      summary: 销售订单列表
      description: 获取销售订单列表（管理员权限）
      operationId: getSalesOrders
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        description: 订单状态筛选
        schema:
          type: string
          enum:
          - pending
          - confirmed
          - shipped
          - completed
          - cancelled
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesOrder'
    post:
      tags:
      - 销售管理
      summary: 创建销售订单
      description: 创建新的销售订单（管理员权限）
      operationId: createSalesOrder
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalesOrderRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrder'
        '400':
          description: 请求参数错误
  /api/sales/deliveries:
    post:
      tags:
      - 销售管理
      summary: 销售出库
      description: 根据销售订单创建销售出库单（管理员权限）
      operationId: createSalesDelivery
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sales_order_id
              properties:
                sales_order_id:
                  type: integer
                  description: 销售订单ID
                  example: 1
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockOut'
        '400':
          description: 请求参数错误
  /api/seckill/activities:
    get:
      tags:
      - 秒杀功能
      summary: 秒杀活动列表
      description: 获取所有秒杀活动列表
      operationId: getSeckillActivities
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeckillActivity'
    post:
      summary: POST /api/seckill/activities
      tags:
      - seckill
      responses:
        '200':
          description: Success
  /api/seckill/{activity_id}/{product_id}:
    post:
      tags:
      - 秒杀功能
      summary: 秒杀商品
      description: 参与秒杀活动，使用Redis原子操作防止超卖
      operationId: seckillProduct
      security:
      - bearerAuth: []
      parameters:
      - name: activity_id
        in: path
        required: true
        description: 活动ID
        schema:
          type: integer
      - name: product_id
        in: path
        required: true
        description: 商品ID
        schema:
          type: integer
      responses:
        '201':
          description: 秒杀成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  order_id:
                    type: integer
                    example: 123
                  order_no:
                    type: string
                    example: SK20240101120000ABCD1234
                  message:
                    type: string
                    example: 秒杀成功
        '400':
          description: 秒杀失败（库存不足、限购等）
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 库存不足
  /api/finance/vouchers:
    get:
      tags:
      - 财务管理
      summary: 凭证列表
      description: 获取财务凭证列表（管理员权限）
      operationId: getVouchers
      security:
      - bearerAuth: []
      parameters:
      - name: business_type
        in: query
        description: 业务类型筛选
        schema:
          type: string
      - name: business_id
        in: query
        description: 业务ID筛选
        schema:
          type: integer
      - name: start_date
        in: query
        description: 开始日期（ISO格式）
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: 结束日期（ISO格式）
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Voucher'
    post:
      summary: POST /api/finance/vouchers
      tags:
      - finance
      responses:
        '200':
          description: Success
  /api/finance/profit-statement:
    get:
      tags:
      - 财务管理
      summary: 利润表
      description: 生成利润表（管理员权限）
      operationId: getProfitStatement
      security:
      - bearerAuth: []
      parameters:
      - name: start_date
        in: query
        description: 开始日期（ISO格式）
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: 结束日期（ISO格式）
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitStatement'
  /api/finance/balance-sheet:
    get:
      tags:
      - 财务管理
      summary: 资产负债表
      description: 生成资产负债表（管理员权限）
      operationId: getBalanceSheet
      security:
      - bearerAuth: []
      parameters:
      - name: as_of_date
        in: query
        description: 截止日期（ISO格式）
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSheet'
  /api/finance/subject-balance:
    get:
      tags:
      - 财务管理
      summary: 科目余额表
      description: 获取所有科目的余额表（管理员权限）
      operationId: getSubjectBalance
      security:
      - bearerAuth: []
      parameters:
      - name: start_date
        in: query
        description: 开始日期（ISO格式）
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: 结束日期（ISO格式）
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountBalance'
  /api/inventory/transactions:
    get:
      tags:
      - 库存管理
      summary: 库存流水
      description: 获取库存流水记录（管理员权限）
      operationId: getInventoryTransactions
      security:
      - bearerAuth: []
      parameters:
      - name: product_id
        in: query
        description: 商品ID筛选
        schema:
          type: integer
      - name: business_type
        in: query
        description: 业务类型筛选
        schema:
          type: string
          enum:
          - stock_in
          - stock_out
          - adjust
      - name: start_date
        in: query
        description: 开始日期（ISO格式）
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: 结束日期（ISO格式）
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockRecord'
  /api/inventory/adjust:
    post:
      tags:
      - 库存管理
      summary: 库存调整
      description: 调整商品库存（正数增加，负数减少）（管理员权限）
      operationId: adjustInventory
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustInventoryRequest'
      responses:
        '200':
          description: 调整成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 库存调整成功
                  product_id:
                    type: integer
                    example: 1
                  quantity_before:
                    type: integer
                    example: 100
                  quantity_after:
                    type: integer
                    example: 110
                  quantity_change:
                    type: integer
                    example: 10
        '400':
          description: 请求参数错误
        '404':
          description: 商品不存在
  /api/test/init:
    post:
      summary: 测试数据初始化
      description: 为自动化测试创建基础数据（用户、商品、秒杀活动、订单）。幂等设计，重复调用不创建重复数据。
      tags:
      - test
      responses:
        '200':
          description: 初始化成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user_id:
                    type: integer
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                  seckill_activities:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        status:
                          type: string
                  seckill_products:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        activity_id:
                          type: integer
                        product_id:
                          type: integer
                        seckill_price:
                          type: number
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        order_no:
                          type: string
                  seckill_orders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        order_no:
                          type: string
  /api/register:
    post:
      summary: POST /api/register
      tags:
      - register
      responses:
        '200':
          description: Success
  /api/login:
    post:
      summary: POST /api/login
      tags:
      - login
      responses:
        '200':
          description: Success
  /api/user/me:
    get:
      summary: GET /api/user/me
      tags:
      - user
      responses:
        '200':
          description: Success
  /api/products/<int:product_id>:
    get:
      tags:
      - 商品管理
      summary: 商品详情
      description: 获取指定商品的详细信息
      operationId: getProduct
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: 商品ID
        schema:
          type: integer
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: 商品不存在
    put:
      tags:
      - 商品管理
      summary: 更新商品
      description: 更新商品信息（管理员权限）
      operationId: updateProduct
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: 商品ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: 商品不存在
    delete:
      tags:
      - 商品管理
      summary: 删除商品
      description: 删除商品（软删除，管理员权限）
      operationId: deleteProduct
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: 商品ID
        schema:
          type: integer
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 商品已删除
        '404':
          description: 商品不存在
  /api/products/<int:product_id>/inventory:
    get:
      tags:
      - 商品管理
      summary: 商品库存查询
      description: 查询指定商品的库存信息
      operationId: getProductInventory
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: 商品ID
        schema:
          type: integer
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventorySummary'
        '404':
          description: 商品不存在
  /api/seckill/list:
    get:
      summary: GET /api/seckill/list
      tags:
      - seckill
      responses:
        '200':
          description: Success
  /api/seckill/<int:product_id>/detail:
    get:
      summary: GET /api/seckill/<int:product_id>/detail
      tags:
      - seckill
      responses:
        '200':
          description: Success
  /api/seckill/order:
    post:
      summary: POST /api/seckill/order
      tags:
      - seckill
      responses:
        '200':
          description: Success
  /api/seckill/order/<int:order_id>:
    get:
      summary: GET /api/seckill/order/<int:order_id>
      tags:
      - seckill
      responses:
        '200':
          description: Success
  /api/seckill/activities/<int:activity_id>:
    delete:
      summary: DELETE /api/seckill/activities/<int:activity_id>
      tags:
      - seckill
      responses:
        '200':
          description: Success
  /api/seckill/status/<int:activity_id>/<int:product_id>:
    get:
      summary: GET /api/seckill/status/<int:activity_id>/<int:product_id>
      tags:
      - seckill
      responses:
        '200':
          description: Success
  /api/seckill/status/<int:product_id>:
    get:
      summary: GET /api/seckill/status/<int:product_id>
      tags:
      - seckill
      responses:
        '200':
          description: Success
  /api/seckill/<int:activity_id>/<int:product_id>:
    post:
      summary: POST /api/seckill/<int:activity_id>/<int:product_id>
      tags:
      - seckill
      responses:
        '200':
          description: Success
  /api/seckill/activities/<int:activity_id>/products:
    post:
      summary: POST /api/seckill/activities/<int:activity_id>/products
      tags:
      - seckill
      responses:
        '200':
