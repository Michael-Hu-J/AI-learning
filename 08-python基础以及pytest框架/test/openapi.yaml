components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Token认证，格式为 "Bearer {token}"
  schemas:
    RegisterRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          description: 用户名
          example: testuser
        password:
          type: string
          description: 密码
          format: password
          example: password123
        email:
          type: string
          format: email
          description: 邮箱（可选）
          example: test@example.com
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          description: 用户名
          example: testuser
        password:
          type: string
          description: 密码
          format: password
          example: password123
    AuthResponse:
      type: object
      properties:
        message:
          type: string
          example: 登录成功
        token:
          type: string
          description: JWT Token
          example: eyJ0eXAiOiJKV1QiLCJhbGc...
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: testuser
        email:
          type: string
          format: email
          example: test@example.com
        role:
          type: string
          enum:
          - customer
          - admin
          example: customer
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T10:00:00Z'
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          description: 商品编码
          example: PROD001
        name:
          type: string
          example: iPhone 15
        description:
          type: string
          example: 苹果最新款手机
        cost_price:
          type: number
          format: float
          description: 成本价
          example: 5000.0
        price:
          type: number
          format: float
          description: 销售价
          example: 5999.0
        stock:
          type: integer
          description: 库存数量
          example: 100
        seckill_price:
          type: number
          format: float
          nullable: true
          description: 秒杀价格
          example: 5499.0
        seckill_stock:
          type: integer
          description: 秒杀库存
          example: 10
        seckill_start_time:
          type: string
          format: date-time
          nullable: true
          example: '2024-01-01T10:00:00Z'
        seckill_end_time:
          type: string
          format: date-time
          nullable: true
          example: '2024-01-01T12:00:00Z'
        status:
          type: string
          enum:
          - active
          - inactive
          example: active
        is_seckill_active:
          type: boolean
          description: 是否秒杀进行中
          example: false
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T10:00:00Z'
    CreateProductRequest:
      type: object
      required:
      - name
      - price
      properties:
        name:
          type: string
          example: iPhone 15
        description:
          type: string
          example: 商品描述
        code:
          type: string
          example: PROD001
        cost_price:
          type: number
          format: float
          example: 5000.0
        price:
          type: number
          format: float
          example: 5999.0
        stock:
          type: integer
          example: 100
        seckill_price:
          type: number
          format: float
          example: 5499.0
        seckill_stock:
          type: integer
          example: 10
        seckill_start_time:
          type: string
          format: date-time
          example: '2024-01-01T10:00:00Z'
        seckill_end_time:
          type: string
          format: date-time
          example: '2024-01-01T12:00:00Z'
    UpdateProductRequest:
      type: object
      description: 所有字段都是可选的
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        stock:
          type: integer
        cost_price:
          type: number
          format: float
        seckill_price:
          type: number
          format: float
        seckill_stock:
          type: integer
        seckill_start_time:
          type: string
          format: date-time
        seckill_end_time:
