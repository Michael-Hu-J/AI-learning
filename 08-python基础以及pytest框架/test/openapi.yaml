          type: number
          format: float
          description: 贷方合计
        balance:
          type: number
          format: float
          description: 余额
    StockRecord:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        product_name:
          type: string
        business_type:
          type: string
          enum:
          - stock_in
          - stock_out
          - adjust
        business_id:
          type: integer
        quantity_change:
          type: integer
          description: 数量变化（正数入库，负数出库）
        quantity_before:
          type: integer
          description: 变化前库存
        quantity_after:
          type: integer
          description: 变化后库存
        unit_cost:
          type: number
          format: float
          nullable: true
          description: 成本单价
        remark:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    AdjustInventoryRequest:
      type: object
      required:
      - product_id
      - quantity
      properties:
        product_id:
          type: integer
          description: 商品ID
          example: 1
        quantity:
          type: integer
          description: 调整数量（正数增加，负数减少）
          example: 10
        remark:
          type: string
          description: 调整说明
          example: 库存调整
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: 错误信息
          example: 请求参数错误
        details:
          type: string
          description: 错误详情（可选）
          nullable: true
