[pytest]
# pytest 配置文件

# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试目录（含 OpenAPI 生成用例目录 output，否则只跑 pytest test_商品管理.py 会找不到文件 → collected 0）
# 仅收集 tests/；生成用例在 output/ 内单独 pytest（见 README）
testpaths = tests

# 命令行参数
addopts = 
    -v
    --strict-markers
    --tb=short
    --maxfail=5
    -p no:asyncio



# 标记（用于分类和筛选）
markers =
    android: Android 平台测试
    ios: iOS 平台测试
    smoke: 冒烟测试
    regression: 回归测试
    critical: 关键用例
    api: API测试
    ui: UI 测试
    customers: OpenAPI 客户管理
    user: OpenAPI 用户
    suppliers: OpenAPI 供应商
    stock: OpenAPI 库存
    seckill: OpenAPI 秒杀
    sales: OpenAPI 销售
    register: OpenAPI 注册
    purchase: OpenAPI 采购
    orders: OpenAPI 订单
    login: OpenAPI 登录
    finance: OpenAPI 财务
    认证: OpenAPI 认证模块
    商品管理: OpenAPI 商品管理
    秒杀功能: OpenAPI 秒杀功能
    库存管理: OpenAPI 库存管理
    销售管理: OpenAPI 销售管理
    采购管理: OpenAPI 采购管理
    财务管理: OpenAPI 财务管理
    h: Happy Path 主路径成功
    e: Edge 边界值测试
    x: Exception 异常/拒绝
    p: Performance 性能粗测
    s: Security 安全测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 禁用警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
