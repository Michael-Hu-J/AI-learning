<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 - 演示商城</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f7fa;max-width:400px;margin:80px auto;padding:20px}h2{text-align:center;font-size:22px;font-weight:600;color:#1a1a1a;margin-bottom:32px}.card{background:#fff;border-radius:8px;padding:32px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.fg{margin-bottom:20px}label{display:block;font-size:13px;color:#666;margin-bottom:6px;font-weight:500}input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;transition:border-color .2s;box-sizing:border-box}input:focus{border-color:#1a73e8;outline:none;box-shadow:0 0 0 2px rgba(26,115,232,.15)}button{width:100%;padding:12px;background:#1a73e8;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:500;cursor:pointer;transition:background .2s}button:hover{background:#1557b0}p{text-align:center;color:#999;font-size:14px;margin-top:20px}a{color:#1a73e8;text-decoration:none}.hint{font-size:12px;color:#bbb;margin-top:16px}</style></head><body><div class="card"><h2>用户登录</h2><form id="loginForm" method="POST" action="/login"><div class="fg"><label>用户名</label><input id="username" type="text" name="username" placeholder="请输入用户名" required></div><div class="fg"><label>密码</label><input id="password" type="password" name="password" placeholder="请输入密码" required></div><button type="submit">登录</button></form>{% if error %}<div style="background:#fef2f2;color:#dc2626;padding:8px 12px;border-radius:6px;font-size:13px;margin-top:12px">{{ error }}</div>{% endif %}<p>还没有账号？<a href="/register">注册</a></p><p class="hint">演示账号: admin / admin123</p></div></body></html>
