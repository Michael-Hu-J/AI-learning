<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册 - 演示商城</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f7fa;max-width:400px;margin:80px auto;padding:20px}h2{text-align:center;font-size:22px;font-weight:600;color:#1a1a1a;margin-bottom:32px}.card{background:#fff;border-radius:8px;padding:32px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.fg{margin-bottom:20px}label{display:block;font-size:13px;color:#666;margin-bottom:6px;font-weight:500}input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;transition:border-color .2s;box-sizing:border-box}input:focus{border-color:#2e7d32;outline:none;box-shadow:0 0 0 2px rgba(46,125,50,.15)}button{width:100%;padding:12px;background:#2e7d32;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:500;cursor:pointer;transition:background .2s}button:hover{background:#1b5e20}p{text-align:center;color:#999;font-size:14px;margin-top:20px}a{color:#1a73e8;text-decoration:none}</style></head><body><div class="card"><h2>用户注册</h2><form id="registerForm" method="POST" action="/register"><div class="fg"><label>用户名</label><input id="reg-username" type="text" name="username" placeholder="请输入用户名" required></div><div class="fg"><label>密码</label><input id="reg-password" type="password" name="password" placeholder="请设置密码" required></div><button type="submit">注册</button></form><p>已有账号？<a href="/login">登录</a></p></div></body></html>
