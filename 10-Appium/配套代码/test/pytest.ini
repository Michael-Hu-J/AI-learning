[pytest]
# pytest配置文件

# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = tests

# 命令行参数
# 注意：alluredir需要在运行时通过命令行参数或环境变量动态设置
# 默认值：reports/allure-results
addopts = 
    -v
    --strict-markers
    --tb=short
    --maxfail=5

# 标记
markers =
    android: Android平台测试
    ios: iOS平台测试
    smoke: 冒烟测试
    regression: 回归测试
    critical: 关键用例
    appium: 需要 Appium 环境的 UI 测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 禁用警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

