<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - Appium Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .nav { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .nav a { padding: 12px 24px; background: white; color: #667eea; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .nav a:hover { background: #667eea; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 Appium Demo 电商系统</h1>
            <p>移动端自动化测试演示应用</p>
        </div>
        <div class="nav">
            <a href="/login">登录</a>
            <a href="/register">注册</a>
            <a href="/products">商品</a>
            <a href="/cart">购物车</a>
            <a href="/orders">订单</a>
        </div>
    </div>
</body>
</html>
