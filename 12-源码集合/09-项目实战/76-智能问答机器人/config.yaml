# =============================================================================
#  config.yaml — 智能问答机器人配置文件
#  作者: 测试员周周 (14年测试老兵)
#  描述: 集中管理问答机器人的全部运行参数
#  覆盖方式: 环境变量 QA_BOT_* 可覆盖对应项 (详见 src/config.py)
# =============================================================================

# ==================== 应用基础配置 ====================
app:
  name: "智能问答机器人"
  version: "1.0.0"
  debug: false

# ==================== 知识库配置 ====================
knowledge_base:
  # 知识库文档路径（支持多个文件用逗号分隔）
  path: "data/knowledge"
  # 启动时自动加载知识库
  auto_load: true
  # 索引刷新间隔（秒）
  index_refresh_interval: 300

# ==================== 检索配置 ====================
retrieval:
  # 检索返回的最相关文档数
  top_k: 5
  # 检索得分阈值：低于此值的查询直接拒答
  # 阈值太高 → 该回答的不回答（召回率低）
  # 阈值太低 → 不该回答的乱回答（准确率低）
  threshold: 0.15
  # 各维度权重（总和应为 1.0）
  keyword_weight: 0.4     # 关键词匹配权重
  semantic_weight: 0.4    # 语义相似度权重
  freshness_weight: 0.2   # 文档时效性权重
  # 是否启用同义词扩展
  enable_synonym_expansion: true

# ==================== 生成配置 ====================
generation:
  # 回答最大字符数
  max_length: 200
  # LLM 温度参数（越低越保守）
  temperature: 0.3
  # 无 LLM 时是否启用降级模板
  enable_fallback: true

# ==================== 质量评估配置 ====================
quality:
  # 综合得分通过阈值（>= 此值算通过）
  pass_threshold: 0.7
  # 各维度权重（总和应为 1.0）
  factual_weight: 0.35       # 事实性
  relevance_weight: 0.25     # 相关性
  safety_weight: 0.25        # 安全性
  completeness_weight: 0.15  # 完整性

# ==================== 拒答配置 ====================
rejection:
  # 常规拒答消息
  message: "抱歉，我暂时没有找到相关信息。建议您联系人工客服。"
  # 降级场景的拒答消息
  fallback_message: "抱歉，我暂时没有找到相关信息。"

# ==================== 日志配置 ====================
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/qa_bot.log"
