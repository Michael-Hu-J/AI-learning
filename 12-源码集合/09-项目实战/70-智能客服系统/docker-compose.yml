version: '3.8'

services:
  customer-bot:
    build: .
    container_name: customer-service-bot
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - CUSTOM_BOT_DEBUG=${CUSTOM_BOT_DEBUG:-false}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data:ro
    command: ["python", "main.py", "--mode", "demo"]

