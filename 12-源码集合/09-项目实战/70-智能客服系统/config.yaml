# 智能客服系统配置文件
# 复制此文件为 config.yaml 并修改相应配置

app:
  name: "智能客服系统"
  version: "1.0.0"
  debug: false

# 对话管理配置
conversation:
  max_history: 20        # 最大历史消息数
  session_timeout: 1800  # 会话超时时间（秒），默认 30 分钟
  max_rounds: 5          # 最大对话轮次，超过后触发转人工

# 检索配置
retrieval:
  top_k: 3                          # 检索返回结果数
  knowledge_base_path: "data/knowledge_base.json"  # 知识库文件路径

# LLM 配置（可选，启用后使用 LLM 生成回答）
llm:
  enabled: false                    # 是否启用 LLM
  provider: "dashscope"             # LLM 提供商
  model: "qwen-plus"                # 模型名称
  api_key: ""                       # API Key（建议通过环境变量 DASHSCOPE_API_KEY 设置）
  base_url: "https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation"

# 日志配置
logging:
  level: "INFO"                     # 日志级别：DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
